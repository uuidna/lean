name: deploy

# lean.uuidna.com ships only after the same gate pre-push already ran.
# Sibling involution matches ci.yml. No credential in this file unless CLOUDFLARE_API_TOKEN is set.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [ci]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v7
        with:
          repository: uuidna/qpu
          path: qpu
      - uses: actions/checkout@v7
        with:
          path: lean
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            qpu/package-lock.json
            lean/package-lock.json
      - name: Inner QPU
        working-directory: qpu
        run: npm ci
      - run: npm ci
      - run: npm run build
      - run: npm run docs:build
      - name: Deploy to Cloudflare (only when the token exists)
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$HAS_CF" = "true" ]; then
            npm exec -- wrangler deploy
          else
            echo "::notice::ci PASSED but the worker was not deployed — CLOUDFLARE_API_TOKEN is not set"
          fi
