name: ci

# THE ONE DOOR. Deploy and release call this. Push to main does not also fire it.
# Census guard: src/census.test.ts reads ../uuidna/lean when the sibling checkout exists, else uuidna.com/lean/<File>.lean.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v7
        with:
          path: lean
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lean/package-lock.json
      - name: Install exact (lockfile law; no install scripts)
        run: npm ci
      - name: Gate — tests · docs:build
        run: npm run ci
