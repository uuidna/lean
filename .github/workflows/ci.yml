name: ci

# THE ONE DOOR. Deploy and release call this. Push to main does not also fire it.
# Sibling involution: lean file:../qpu occupies the local layout.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v7
        with:
          repository: uuidna/qpu
          path: qpu
      - uses: actions/checkout@v7
        with:
          path: lean
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            qpu/package-lock.json
            lean/package-lock.json
      - name: Inner QPU
        working-directory: qpu
        run: npm ci
      - name: Install exact (lockfile law; no install scripts)
        run: npm ci
      - name: Gate — tests · docs:build
        run: npm run ci
